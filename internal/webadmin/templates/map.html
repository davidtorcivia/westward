{{template "head" .}}
<h1>Map</h1>
<section class="card">
  <div
    id="map"
    data-lat="{{.Data.lat}}"
    data-lon="{{.Data.lon}}"
    aria-label="Camera map"
  ></div>
  <div class="mapbar">
    <p class="hint">
      Gold markers are your cameras · dim dots are DOT cameras, click one to add
      it · <a href="/admin/cameras">camera list</a>
    </p>
    <form method="post" action="/admin/dot/refresh" class="inline">
      <input type="hidden" name="csrf" value="{{$.CSRF}}" />
      <button class="btn sm">refresh DOT list</button>
    </form>
  </div>
</section>
<script src="/admin/static/vendor/leaflet.js"></script>
<script src="/admin/static/map.js" defer></script>
{{template "foot" .}}
